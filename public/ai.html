<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-R AI - Digital Learning Portal</title>

  <!-- Firebase SDKs for Route Protection & Auth Tokens -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$'], ['[', ']']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background-color: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .brand h1 {
      font-size: 1.2rem;
      color: #38bdf8;
    }

    .brand span {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      font-size: 0.85rem;
      color: #cbd5e1;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .nav-btn {
      background-color: #0284c7;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-logout {
      background-color: #ef4444;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 15px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message.ai {
      background-color: #1e293b;
      color: #f8fafc;
      align-self: flex-start;
      border-left: 4px solid #38bdf8;
    }

    .message.user {
      background-color: #0284c7;
      color: #ffffff;
      align-self: flex-end;
    }

    .message.ai p { margin-bottom: 8px; }
    .message.ai ul, .message.ai ol { margin-left: 20px; margin-bottom: 8px; }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      background-color: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-area button {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer-credit {
      text-align: center;
      padding: 10px;
      font-size: 0.8rem;
      color: #64748b;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <h1>🤖 CSS-R AI Portal</h1>
      <span>Central Secondary School Ruhaama</span>
    </div>
    <div class="nav-actions">
      <span id="userBadge" class="user-badge">Loading...</span>
      <a href="/" class="nav-btn">← Home</a>
      <button onclick="handleLogout()" class="nav-btn btn-logout">Sign Out</button>
    </div>
  </div>

  <div class="chat-container">
    <div id="chatMessages" class="chat-messages">
      <div class="message ai">
        <strong>CSS-R AI:</strong><br>
        👋 Hello! I am CSS-R AI, your digital learning assistant for Central Secondary School Ruhaama. How can I help you today?
      </div>
    </div>

    <form id="chatForm" class="input-area">
      <input type="text" id="userInput" placeholder="Ask CSS-R AI a learning question..." required autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <div class="footer-credit">
    Created by Lumala Hamuza • Antelope Technologies / Antelope Labs
  </div>

  <script>
    // --- FIREBASE INITIALIZATION & ROUTE GUARD ---
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "css-r-ai.firebaseapp.com",
      projectId: "css-r-ai",
      storageBucket: "css-r-ai.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    let currentUser = null;

    // Route Protection Guard
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        // Redirect unauthorized users to login page
        window.location.href = "/login";
      } else {
        currentUser = user;
        document.getElementById('userBadge').textContent = user.displayName || user.email;
        await loadChatHistory();
      }
    });

    function handleLogout() {
      auth.signOut().then(() => {
        window.location.href = "/login";
      });
    }

    // --- CHAT LOGIC ---
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');

    // Local state to track short-term conversation context for Groq
    let chatHistory = [];

    function appendMessage(sender, text, isAi) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isAi ? 'ai' : 'user'}`;

      if (isAi) {
        // Pre-process math tags so marked doesn't strip backslashes
        let formattedText = text
          .replace(/\[\s*/g, '$$$$')           .replace(/\s*\]/g, '$$$$');

        const htmlContent = window.marked ? marked.parse(formattedText) : escapeHtml(text);
        msgDiv.innerHTML = `<strong>${sender}:</strong><br>${htmlContent}`;
      } else {
        msgDiv.innerHTML = `<strong>${sender}:</strong><br>${escapeHtml(text)}`;
      }

      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Render math equations with MathJax
      if (isAi && window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([msgDiv]).catch((err) => console.error("MathJax error:", err));
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    // Fetch user-isolated chat history from Firestore with Auth Token
    async function loadChatHistory() {
      try {
        if (!currentUser) return;
        const token = await currentUser.getIdToken();

        const response = await fetch('/api/history', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await response.json();

        if (data.history && data.history.length > 0) {
          chatHistory = []; // Reset local memory
          data.history.forEach(item => {
            appendMessage('You', item.userMessage, false);
            appendMessage('CSS-R AI', item.aiReply, true);

            // Seed local chat memory so AI context persists across refresh
            chatHistory.push({ role: 'user', content: item.userMessage });
            chatHistory.push({ role: 'assistant', content: item.aiReply });
          });
        }
      } catch (err) {
        console.error("Failed to restore history:", err);
      }
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = userInput.value.trim();
      if (!question) return;

      appendMessage('You', question, false);
      userInput.value = '';

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message ai';
      loadingDiv.innerHTML = '<em>CSS-R AI is thinking...</em>';
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const token = currentUser ? await currentUser.getIdToken() : "";

        // Send current message along with token & past chat history
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            message: question,
            history: chatHistory.slice(-10) // Limit to last 10 messages for speed
          })
        });

        const data = await response.json();

        if (chatMessages.contains(loadingDiv)) {
          chatMessages.removeChild(loadingDiv);
        }

        if (response.ok) {
          appendMessage('CSS-R AI', data.reply, true);

          // Append exchange to local history context
          chatHistory.push({ role: 'user', content: question });
          chatHistory.push({ role: 'assistant', content: data.reply });
        } else {
          appendMessage('CSS-R AI', data.error || 'Sorry, something went wrong.', true);
        }
      } catch (err) {
        if (chatMessages.contains(loadingDiv)) {
          chatMessages.removeChild(loadingDiv);
        }
        appendMessage('CSS-R AI', 'Connection error. Please try again.', true);
      } finally {
        userInput.focus();
      }
    });
  </script>
</body>
</html>
