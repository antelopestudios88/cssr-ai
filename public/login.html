<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up | CSS-R Digital Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Auth specific layout */
        .auth-container {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            box-shadow: var(--shadow-glow);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Tab Switcher */
        .auth-tabs {
            display: flex;
            background: #0f172a;
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--cssr-red);
            color: #ffffff;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-light);
        }

        .btn-full {
            width: 100%;
            justify-content: center;
            margin-top: 10px;
            padding: 12px;
        }

        /* Google Sign-In */
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }

        .auth-divider span {
            padding: 0 10px;
        }

        .google-btn {
            width: 100%;
            background-color: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            padding: 11px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .google-btn:hover {
            background-color: #f1f5f9;
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        .auth-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .auth-message.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            display: block;
        }

        .auth-message.success {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #86efac;
            display: block;
        }

        .info-note {
            background-color: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 10px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="brand">
            <strong>CSS-R</strong>
            <span>Digital Portal</span>
        </div>
        <a href="index.html" class="button secondary" style="padding: 6px 14px; font-size: 0.85rem;">← Home</a>
    </nav>

    <main class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <h2 id="formTitle">Welcome Back</h2>
                <p id="formSubtitle">Sign in to access your personal CSS-R AI portal</p>
            </div>

            <!-- Tab Buttons -->
            <div class="auth-tabs">
                <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
                <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Notification Message -->
            <div id="authMessage" class="auth-message"></div>

            <!-- Form -->
            <form id="authForm" onsubmit="handleAuth(event)">

                <!-- Sign-Up Specific Fields -->
                <div id="signupFields" style="display: none;">
                    <div class="info-note">
                        📩 <strong>Note:</strong> After signing up, a verification link will be emailed to you. Please check your <strong>Inbox & Spam folder</strong>.
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="e.g. Lumala Hamuza">
                    </div>

                    <div class="form-group">
                        <label for="studentClass">Class / Role</label>
                        <select id="studentClass">
                            <option value="Senior 1">Senior 1 (S1)</option>
                            <option value="Senior 2">Senior 2 (S2)</option>
                            <option value="Senior 3">Senior 3 (S3)</option>
                            <option value="Senior 4">Senior 4 (S4)</option>
                            <option value="Senior 5">Senior 5 (S5)</option>
                            <option value="Senior 6">Senior 6 (S6)</option>
                            <option value="Teacher/Staff">Teacher / Staff</option>
                        </select>
                    </div>
                </div>

                <!-- Common Fields -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="student@cssr.edu" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" id="submitBtn" class="button primary btn-full">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>OR</span>
            </div>

            <!-- Google Sign-In Button -->
            <button class="google-btn" onclick="handleGoogleSignIn()">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="auth.js"></script>
</body>
</html>
